{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h3 class="mb-0"><i class="fas fa-key me-2"></i>Зміна пароля</h3>
                </div>
                <div class="card-body">
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            {% for field, errors in form.errors.items %}
                                {% for error in errors %}
                                    <p>{{ error }}</p>
                                {% endfor %}
                            {% endfor %}
                        </div>
                    {% endif %}
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_old_password" class="form-label">Старий пароль</label>
                            <input type="password" name="old_password" class="form-control" required id="id_old_password">
                        </div>
                        <div class="mb-3">
                            <label for="id_new_password1" class="form-label">Новий пароль</label>
                            <input type="password" name="new_password1" class="form-control" required id="id_new_password1">
                            <small class="form-text text-muted">Пароль має містити принаймні 8 символів.</small>
                        </div>
                        <div class="mb-4">
                            <label for="id_new_password2" class="form-label">Підтвердіть новий пароль</label>
                            <input type="password" name="new_password2" class="form-control" required id="id_new_password2">
                        </div>
                        <button type="submit" class="btn btn-warning w-100">Змінити пароль</button>
                        <a href="{% url 'profile' %}" class="btn btn-outline-dark w-100 mt-2">Скасувати</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
