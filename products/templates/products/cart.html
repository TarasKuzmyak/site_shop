{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-12">
            <h2 class="border-bottom pb-2 mb-4"><i class="fas fa-shopping-cart me-2"></i>Кошик</h2>
        </div>
    </div>
    
    <div id="cart-container">
        <!-- JavaScript буде рендерити кошик тут -->
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const cartContainer = document.getElementById('cart-container');
    
    function renderCart(cart) {
        if (cart.length === 0) {
            cartContainer.innerHTML = `
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>Ваш кошик порожній.
                </div>
                <a href="{% url 'product_list' %}" class="btn btn-outline-dark">
                    <i class="fas fa-arrow-left me-2"></i>Продовжити покупки
                </a>
            `;
            return;
        }
        
        const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        
        cartContainer.innerHTML = `
            <div class="row">
                <div class="col-lg-8">
                    <div class="card mb-4">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th>Товар</th>
                                            <th>Ціна</th>
                                            <th>Кількість</th>
                                            <th>Сума</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${cart.map(item => `
                                            <tr>
                                                <td>
                                                    <div class="d-flex align-items-center">
                                                        <img src="${item.image}" alt="${item.name}" class="me-3" style="width: 80px;"
                                                            onerror="this.onerror=null; this.src='{% static 'img/no-image.png' %}'">
                                                        <div>
                                                            <h5 class="mb-0">${item.name}</h5>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td>${item.price}₴</td>
                                                <td>${item.quantity}</td>
                                                <td>${(item.price * item.quantity).toFixed(2)}₴</td>
                                                <td>
                                                    <button class="btn btn-sm btn-outline-danger remove-item" data-id="${item.id}">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-4">
                        <a href="{% url 'product_list' %}" class="btn btn-outline-dark">
                            <i class="fas fa-arrow-left me-2"></i>Продовжити покупки
                        </a>
                        <a href="{% url 'checkout' %}" class="btn btn-warning">
                            Оформити замовлення <i class="fas fa-arrow-right ms-2"></i>
                        </a>
                    </div>
                </div>
                
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-header bg-dark text-white">
                            <h5 class="mb-0">Підсумок кошика</h5>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-2">
                                <span>Товари (${cart.length})</span>
                                <span>${totalPrice.toFixed(2)}₴</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Доставка</span>
                                <span>Безкоштовно</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between fw-bold">
                                <span>До оплати</span>
                                <span>${totalPrice.toFixed(2)}₴</span>
                            </div>
                            <a href="{% url 'checkout' %}" class="btn btn-warning w-100 mt-3">
                                Оформити замовлення
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        // Додати обробники подій для видалення товарів
        document.querySelectorAll('.remove-item').forEach(button => {
            button.addEventListener('click', () => {
                CartManager.removeFromCart(button.dataset.id);
                loadCart();
                UIManager.showToast('Товар видалено з кошика', 'warning');
            });
        });
    }

    async function loadCart() {
        let cart = [];
        
        {% if user.is_authenticated %}
            // Синхронізація кошика для авторизованих користувачів
            try {
                const response = await fetch('/sync-cart/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify(CartManager.getCart())
                });
                
                if (response.ok) {
                    const serverCart = await fetch('/api/get-cart/').then(r => r.json());
                    cart = serverCart;
                }
            } catch (error) {
                console.error('Помилка синхронізації кошика:', error);
                cart = CartManager.getCart();
            }
        {% else %}
            // Неавторизовані користувачі - тільки localStorage
            cart = CartManager.getCart();
        {% endif %}
        
        renderCart(cart);
    }
    
    // Завантажити кошик при завантаженні сторінки
    loadCart();
});
</script>
{% endblock %}
